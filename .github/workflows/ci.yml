name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright

jobs:
  library:
    name: net11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use the runner temp directory
        run: |
          echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
          echo "TMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"
          echo "TEMP=${RUNNER_TEMP}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Test the release gates
        run: dotnet test tests/MicroSharp.ReleaseGate.Tests/MicroSharp.ReleaseGate.Tests.csproj --configuration Release

      - name: Install OpenAL
        run: sudo apt-get update && sudo apt-get install -y libopenal1

      - name: Install Chromium for the simulated microphone
        run: bash scripts/install-playwright-chromium.sh

      - name: Test
        run: dotnet test MicroSharp.slnx --configuration Release

      - name: Browser capture
        run: dotnet test tests/MicroSharp.Browser.Tests/MicroSharp.Browser.Tests.csproj --configuration Release --filter SimulatedMicrophoneProducesPcmThroughTheBrowserModule

      - name: Pack and consume
        run: bash scripts/verify-local-packages.sh

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: WebAssembly sample
        run: |
          export NUGET_PACKAGES="${RUNNER_TEMP}/nuget-packages-wasm"
          mkdir -p "${NUGET_PACKAGES}"
          dotnet publish samples/MicroSharp.BlazorWasm/MicroSharp.BlazorWasm.csproj --configuration Release
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- verify-packed \
            --packages "${GITHUB_WORKSPACE}/artifacts/packages" \
            --cache "${NUGET_PACKAGES}" \
            --version-file Directory.Build.props \
            --assets "${GITHUB_WORKSPACE}/samples/MicroSharp.BlazorWasm/obj/project.assets.json" \
            --copy "${GITHUB_WORKSPACE}/samples/MicroSharp.BlazorWasm/bin/Release/net11.0/publish/wwwroot/_content/MicroSharp.Browser/microsharp-capture.js=staticwebassets/microsharp-capture.js" \
            --copy "${GITHUB_WORKSPACE}/samples/MicroSharp.BlazorWasm/bin/Release/net11.0/publish/wwwroot/_content/MicroSharp.Browser/pcm-recorder-processor.js=staticwebassets/pcm-recorder-processor.js"
          MICROSHARP_WASM_PUBLISH="${GITHUB_WORKSPACE}/samples/MicroSharp.BlazorWasm/bin/Release/net11.0/publish/wwwroot" \
            dotnet test tests/MicroSharp.Browser.Tests/MicroSharp.Browser.Tests.csproj --configuration Release --filter PublishedSampleShowsSimulatedCapture

      - name: Write the release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- write-manifest \
            --packages artifacts/packages \
            --version-file Directory.Build.props \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --output artifacts/packages/release-manifest.json
          stage="${RUNNER_TEMP}/microsharp-qualified-packages"
          rm -rf "$stage"
          mkdir -p "$stage"
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- stage-upload \
            --packages artifacts/packages \
            --manifest artifacts/packages/release-manifest.json \
            --destination "$stage"
          echo "QUALIFIED_UPLOAD=${stage}" >> "$GITHUB_ENV"

      - name: Upload the qualified packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: microsharp-qualified-packages
          path: ${{ env.QUALIFIED_UPLOAD }}
          if-no-files-found: error
          retention-days: 90
