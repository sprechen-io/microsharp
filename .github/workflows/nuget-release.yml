name: NuGet release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string
      verify_only:
        description: Verify the published packages without uploading them
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: nuget-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: publish qualified packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a three-part version tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          {
            echo "name=${RELEASE_TAG}"
            echo "ref=refs/tags/${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Qualify the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$sha" != "$tagged" ]]; then
            echo "checkout ${sha} is not ${RELEASE_TAG}" >&2
            exit 1
          fi
          mkdir -p artifacts/release
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100" > artifacts/release/runs.json
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- select-run \
            --commit "$sha" \
            --runs artifacts/release/runs.json \
            --output artifacts/release/run-id.txt
          run_id="$(tr -d '[:space:]' < artifacts/release/run-id.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > artifacts/release/jobs.json
          rm -rf artifacts/qualified
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name microsharp-qualified-packages --dir artifacts/qualified
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- locate \
            --root artifacts/qualified \
            --package-dir-output artifacts/release/package-dir.txt \
            --manifest-output artifacts/release/manifest-path.txt
          package_dir="$(tr -d '[:space:]' < artifacts/release/package-dir.txt)"
          manifest="$(tr -d '[:space:]' < artifacts/release/manifest-path.txt)"
          dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release -- check \
            --tag "$RELEASE_TAG" \
            --commit "$sha" \
            --version-file Directory.Build.props \
            --runs artifacts/release/runs.json \
            --jobs artifacts/release/jobs.json \
            --manifest "$manifest" \
            --packages "$package_dir" \
            --push-list artifacts/release/push-list.txt

      - name: NuGet login
        if: ${{ !inputs.verify_only }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the qualified packages
        if: ${{ !inputs.verify_only }}
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            if [[ "$package" == *.nupkg ]]; then
              dotnet nuget push "$package" --no-symbols --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
            else
              dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
            fi
            status=$?
            [[ "$status" -eq 0 ]] || exit "$status"
          done < artifacts/release/push-list.txt

      - name: Compare the nuget.org restore with the pushed payloads
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/nuget-packages-nugetorg"
          config="${RUNNER_TEMP}/nuget.org-only.config"
          cat > "$config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          playback=samples/MicroSharp.PlaybackWasm/MicroSharp.PlaybackWasm.csproj
          playback_assets=()
          if [[ -f "$playback" ]]; then
            playback_assets=(--assets samples/MicroSharp.PlaybackWasm/obj/project.assets.json)
          fi
          max_attempts=31
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            rm -rf "$cache"
            mkdir -p "$cache"
            export NUGET_PACKAGES="$cache"
            if dotnet restore samples/MicroSharp.Console/MicroSharp.Console.csproj \
                --configfile "$config" \
                --source https://api.nuget.org/v3/index.json \
                --force \
                --no-http-cache \
                --nologo \
              && dotnet restore samples/MicroSharp.BlazorWasm/MicroSharp.BlazorWasm.csproj \
                --configfile "$config" \
                --source https://api.nuget.org/v3/index.json \
                --force \
                --no-http-cache \
                --nologo \
              && { [[ ! -f "$playback" ]] || dotnet restore "$playback" \
                --configfile "$config" \
                --source https://api.nuget.org/v3/index.json \
                --force \
                --no-http-cache \
                --nologo; } \
              && dotnet run --project tools/MicroSharp.ReleaseGate/MicroSharp.ReleaseGate.csproj --configuration Release --no-build -- verify-cache \
                --packages "$(tr -d '[:space:]' < artifacts/release/package-dir.txt)" \
                --cache "$cache" \
                --version-file Directory.Build.props \
                --nuget-config "$config" \
                --assets samples/MicroSharp.Console/obj/project.assets.json \
                --assets samples/MicroSharp.BlazorWasm/obj/project.assets.json "${playback_assets[@]}"
            then
              exit 0
            fi
            echo "nuget.org payload check is not ready (attempt ${attempt})" >&2
            if [[ "$attempt" -lt "$max_attempts" ]]; then
              sleep 30
            fi
          done
          exit 1
